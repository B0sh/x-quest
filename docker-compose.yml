services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_PATH: /app/backend/data/xquest.sqlite
    volumes:
      - xquest_data:/app/backend/data
    restart: unless-stopped

volumes:
  xquest_data:
